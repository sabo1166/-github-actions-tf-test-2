jobs:
  init:
    name: Terraform Init (dev)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: env/dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: terraform init -input=false

  plan:
    name: Terraform Plan (dev)
    needs: init
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: env/dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: terraform validate
        run: terraform validate
      - name: terraform plan -out=tfplan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan
          path: |
            ${{ env.TF_DIR }}/tfplan
            ${{ env.TF_DIR }}/.terraform.lock.hcl
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  apply:
    name: Terraform Apply (dev)
    needs: plan
    if: ${{ inputs.apply }}
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: env/dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-dev-plan
          path: ${{ env.TF_DIR }}
      - name: terraform apply tfplan
        run: terraform apply -input=false -lock-timeout=5m tfplan
