name: Terraform Deploy dev

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================================
  # Terraform Init
  # ============================================================
  init:
    name: Terraform Init - Dev
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-west-2
      ENVIRONMENT: dev
      TF_DIR: env/dev

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------
      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init


  # ============================================================
  # Terraform Validate
  # ============================================================
  validate:
    name: Terraform Validate - Dev
    runs-on: ubuntu-latest
    needs: init

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-west-2
      ENVIRONMENT: dev
      TF_DIR: env/dev

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------
      name: Terraform Init
      working-directory: ${{ env.TF_DIR }}
      run: terraform init

      # --------------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------------
        name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate


  # ============================================================
  # Terraform Plan
  # ============================================================
  plan:
    name: Terraform Plan - Dev
    runs-on: ubuntu-latest
    needs: validate

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-west-2
      ENVIRONMENT: dev
      TF_DIR: env/dev

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------
      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      # --------------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------------
      - name: Terraform Plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -out=tfplan

      # --------------------------------------------------------
      # Upload Terraform Plan
      # --------------------------------------------------------
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: ${{ env.TF_DIR }}/tfplan


  # ============================================================
  # Terraform Apply
  # ============================================================
  apply:
    name: Terraform Apply - Dev
    runs-on: ubuntu-latest
    needs: plan

    # ----------------------------------------------------------
    # GitHub Environment
    # Configure required reviewers:
    # Repository Settings → Environments → dev
    # ----------------------------------------------------------
    environment: dev

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-west-2
      ENVIRONMENT: dev
      TF_DIR: env/dev

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------
      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      # --------------------------------------------------------
      # Download the exact plan created by the Plan job
      # --------------------------------------------------------
      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dev
          path: ${{ env.TF_DIR }}

      # --------------------------------------------------------
      # Terraform Apply
      # --------------------------------------------------------
      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve tfplan
