name: Terraform DEV
# Environment: dev | Region: us-east-1 | Root: env/dev
# State: s3://s3-backend-test-dev-claude/dev/terraform.tfstate (use_lockfile)
# Flow: init -> plan -> upload plan -> (manual approval via "dev" environment) -> apply exact plan
# Authentication: repository secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (+ optional AWS_SESSION_TOKEN)

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the saved plan after approval (false = plan only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  ENVIRONMENT: dev
  AWS_REGION: us-east-1
  TF_DIR: env/dev

jobs:
  init:
    name: Terraform Init (dev)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: env/dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Context
        run: |
          echo "Workflow: Terraform DEV (init)"
          echo "Environment: ${ENVIRONMENT}"
          echo "Region: ${AWS_REGION}"
          echo "Working directory: ${TF_DIR}"

      - name: Guard - provider region matches workflow region
        run: grep -Eq "region[[:space:]]*=[[:space:]]*\"${AWS_REGION}\"" provider.tf

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: terraform init -input=false

  plan:
    name: Terraform Plan (dev)
    needs: init
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: env/dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Context
        run: |
          echo "Workflow: Terraform DEV (plan)"
          echo "Environment: ${ENVIRONMENT}"
          echo "Region: ${AWS_REGION}"
          echo "Working directory: ${TF_DIR}"

      - name: terraform validate
        run: terraform validate

      - name: terraform plan -out=tfplan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan
          path: |
            ${{ env.TF_DIR }}/tfplan
            ${{ env.TF_DIR }}/.terraform.lock.hcl
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  apply
